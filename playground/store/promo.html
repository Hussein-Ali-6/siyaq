<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Siyaq store art</title>
    <!-- Chrome Web Store art. #tile: small promo tile, 440×280. #icon: store icon, 128×128 with the
         recommended 16 px of transparent padding around a 96 px icon. -->
    <style>
      html, body { margin: 0; background: transparent; }
      .tile { display: none; flex-direction: column; justify-content: center; width: 440px; height: 280px; box-sizing: border-box; padding: 0 36px 6px; background: radial-gradient(120% 90% at 100% 0%, #2a2418 0%, #141417 55%); color: #ecebe6; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; position: relative; overflow: hidden; }
      .tile .row { display: flex; align-items: center; gap: 16px; }
      .tile img { width: 64px; height: 64px; border-radius: 14px; }
      .tile .name { font-size: 40px; font-weight: 700; letter-spacing: -0.6px; color: #f2b33d; }
      .tile .tag { margin-top: 26px; font-size: 21px; line-height: 1.3; font-weight: 600; max-width: 368px; text-wrap: balance; }
      .icon { display: none; width: 128px; height: 128px; align-items: center; justify-content: center; }
      .icon img { width: 96px; height: 96px; }
      body.show-tile .tile { display: flex; }
      body.show-icon .icon { display: flex; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="row"><img data-icon alt="" /><span class="name">Siyaq</span></div>
      <div class="tag">English words and sentences, explained in your language, in context.</div>
    </div>
    <div class="icon"><img data-icon alt="" /></div>
    <script type="module" src="./promo.ts"></script>
  </body>
</html>
